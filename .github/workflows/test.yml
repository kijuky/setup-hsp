name: Test

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        hsp-version: ["3.6", "3.7"]

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SDK
        id: setup-hsp
        uses: ./
        with:
          hsp-version: ${{ matrix.hsp-version }}

      - name: Verify hsp-home output
        shell: pwsh
        run: |
          $path = "${{ steps.setup-hsp.outputs.hsp-home }}"
          if (-not $path) { throw "hsp-home output was empty" }
          if (-not (Test-Path "$path\hspcmp.exe")) { throw "hspcmp.exe not found at $path" }
          Write-Host "hsp-home: $path"
